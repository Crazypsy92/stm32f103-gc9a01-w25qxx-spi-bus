name: Host SPI DMA regression

on:
  push:
    branches:
      - codex/stage1_3-dma-tft-check
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, sanitizer]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = sanitizer ]; then
            cmake -S tests/host -B tests/host/build -DCMAKE_C_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          else
            cmake -S tests/host -B tests/host/build
          fi
      - name: Build
        run: cmake --build tests/host/build --parallel 2
      - name: CTest
        run: ctest --test-dir tests/host/build --output-on-failure
